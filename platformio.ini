; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = WheellyESP32

[base]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.2.2
	nanopb/Nanopb@^0.4.93
	madhephaestus/ESP32Servo@^3.2.1
	mathertel/LiquidCrystal_PCF8574@^2.3.0
	adafruit/Adafruit_VL53L0X@^1.2.5
build_flags = 
	-DCORE_DEBUG_LEVEL=3
	-DUSE_ESP_IDF_LOG
	-DCONFIG_ARDUHAL_LOG_COLORS=1
	-DCONFIG_LOG_COLORS=1
	-DCONFIG_LOG_MAXIMUM_LEVEL=5
	-DLOG_LOCAL_LEVEL=ESP_LOG_INFO
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = 
	direct
	esp32_exception_decoder
build_src_filter = 
	-<*>
	+<common/>

[env:WheellyESP32]
extends = base
build_src_filter = 
	${base.build_src_filter}
	+<WheellyESP32/>

[env:TestApiServer]
extends = base
build_src_filter = 
	${base.build_src_filter}
	+<TestApiServer/>

